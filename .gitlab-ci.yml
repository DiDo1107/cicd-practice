# Кейс 2: юнит-тесты при каждом коммите
# Кейс 8: сборка Docker-образа и деплой в Kubernetes через Helm
stages:
  - test
  - build
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

unit-tests:
  stage: test
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
  script:
    - pip install -r requirements-dev.txt
    - flake8 .
    - pytest -v --junitxml=report.xml --cov=app --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-deploy:
  stage: deploy
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  environment:
    name: production
  script:
    # KUBECONFIG — переменная типа File в Settings -> CI/CD -> Variables
    - helm lint helm/cicd-app
    - >
      helm upgrade --install cicd-app helm/cicd-app
      --namespace cicd-app --create-namespace
      --set image.repository=$CI_REGISTRY_IMAGE
      --set image.tag=$CI_COMMIT_SHORT_SHA
      --wait --timeout 5m
    - helm status cicd-app -n cicd-app
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KUBECONFIG
