replicaCount: 2

image:
  repository: registry.gitlab.com/YOUR_USER/cicd-practice
  tag: latest
  pullPolicy: IfNotPresent

# Для приватного GitLab-проекта создайте секрет и укажите его имя:
#   kubectl create secret docker-registry gitlab-registry -n cicd-app \
#     --docker-server=registry.gitlab.com --docker-username=<user> --docker-password=<deploy-token>
imagePullSecrets: []
#  - name: gitlab-registry

service:
  type: NodePort
  port: 80
  targetPort: 5000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
